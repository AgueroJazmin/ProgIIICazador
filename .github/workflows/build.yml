name: Build .NET 10
on:
  push:
    branches: ["main", "feature/estructura-monolito-modular"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ProgIIICazador.Web/ProgIIICazador.Web.csproj
      - run: dotnet build ProgIIICazador.Web/ProgIIICazador.Web.csproj --no-restore --configuration Release