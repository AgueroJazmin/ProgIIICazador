name: Build and test .NET 10

on:
  push:
    branches: ["main", "feature/estructura-monolito-modular"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore ProgIIICazador.sln
      - name: Build complete solution
        run: dotnet build ProgIIICazador.sln --no-restore --configuration Release
      - name: Run unit tests
        run: dotnet test ProgIIICazador.Tests/ProgIIICazador.Tests.csproj --no-build --no-restore --configuration Release
