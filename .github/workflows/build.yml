name: Build and test .NET 10
on:
  push:
    branches: ["main", "feature/estructura-monolito-modular"]
  pull_request:
    branches: ["main"]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ProgIIICazador.Tests/ProgIIICazador.Tests.csproj
      - name: Build web
        run: dotnet build ProgIIICazador.Web/ProgIIICazador.Web.csproj --no-restore --configuration Release
      - name: Run tests
        run: dotnet test ProgIIICazador.Tests/ProgIIICazador.Tests.csproj --no-restore --configuration Release